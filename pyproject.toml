[project]
name = "severance-studio"
version = "0.1.0"
description = "Стемы, пиано-роллы и голоса по промпту — рабочая станция-компаньон для Ableton Live"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6>=6.11",
    "mlx-audio-separator>=0.1.20",
    "demucs-mlx>=1.6",
    "beat-this>=1.1",
    "lv-chordia @ git+https://github.com/openmirlab/lv-chordia.git",
    "mlx-whisper>=0.4.3",
    "pyworld>=0.3.5",
    "basic-pitch[coreml]>=0.4.0",
    "pretty-midi>=0.2.10",
    "mido>=1.3",
    "soundfile>=0.13",
    "yt-dlp",
    "lameenc>=1.8",
    "setuptools>=75,<81",
]

[tool.uv]
package = false
# basic-pitch жёстко тянет tensorflow, у которого нет колёс под py3.12.
# На macOS инференс идёт через coremltools, tensorflow не нужен — обнуляем.
override-dependencies = [
    "tensorflow; sys_platform == 'never'",
    "tensorflow-macos; sys_platform == 'never'",
    # basic-pitch пинит старый numpy, lv-chordia требует >=2.2.6 — форсируем новый
    "numpy>=2.2.6",
]
